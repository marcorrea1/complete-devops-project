---

name: Complete Devops Project Pipline

on:
  push:
    branches:
     ~ main


jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set Short SHA 
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
      - name: Build Docker Image 
        run: |
          docker build -t marcorrea02/complete-devops-project:${{ env.SHORT_SHA }} .
